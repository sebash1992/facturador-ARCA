# El cliente de supabase-py llama a {SUPABASE_URL}/rest/v1/<tabla>.
# PostgREST no maneja prefijos de ruta, asi que este proxy lo recorta.
# Ademas descarta los headers de auth de Supabase: PostgREST corre sin
# JWT (rol anonimo con permisos), y esto solo es alcanzable desde la red
# interna del stack — ningun puerto se publica al host ni a la LAN.
server {
    listen 80;
    listen [::]:80;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Authorization "";
        proxy_set_header apikey "";
    }
}
